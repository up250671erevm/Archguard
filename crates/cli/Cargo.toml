[package]
name = "archguard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Blocks Arch Linux upgrades when relevant Arch news needs attention"

[features]
default = []
## Read installed packages via libalpm instead of `pacman -Qq`.
alpm = ["archguard-core/alpm"]
## Desktop notifications via notify-rust (else falls back to `notify-send`).
notify = ["dep:notify-rust"]

[[bin]]
name = "archguard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
archguard-core = { path = "../core" }
archguard-runner = { path = "../runner" }
archguard-merge = { path = "../merge" }
libc = "0.2"
notify-rust = { version = "4", optional = true, default-features = false, features = ["z", "async"] }
